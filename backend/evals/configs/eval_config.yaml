# Data360 Chat Evaluation Configuration
# ─────────────────────────────────────────────────────────────────
# Central config for all eval settings. Loaded by run_conversation_eval.py.
# Override judge_model via DEEPEVAL_JUDGE_MODEL env var.
# Override chatbot_url via CHATBOT_URL env var.

# ── General ──────────────────────────────────────────────────────

judge_model: "gpt-4.1-mini"
default_max_turns: 5

# ── Chatbot endpoint (for HTTP-based E2E eval) ──────────────────
# When use_http_callback is true, the model_callback hits the live
# chatbot API instead of calling the pipeline in-process.
use_http_callback: false
chatbot_url: "http://localhost:3001"
chatbot_api_base: "http://localhost:8001"

# ── Hyperparameters (logged with each evaluate() call) ──────────
# prompt_version is auto-populated from the git branch at runtime.
hyperparameters:
  prompt_version: "auto"  # Auto-detected from git branch

# ── Synthesizer (for generate_goldens.py) ────────────────────────
synthesizer:
  document_paths:
    - "evals/mvp_features.md"
    - "evals/mvp_user_stories.md"
  max_goldens_per_context: 2
  include_expected_outcome: true
  context_construction:
    max_contexts_per_document: 3
    chunk_size: 1024
    chunk_overlap: 0

# ── Base Metrics ─────────────────────────────────────────────────
# Conversation-level metrics that need holistic view of all turns.
# Only Conversation Completeness stays here — it must track ALL user
# intentions across the full conversation to score partial fulfillment.
# All other metrics are per-turn with aggregation (see per_turn_metrics).

base_metrics:
  - name: "Conversation Completeness"
    type: "geval"
    threshold: 0.5
    criteria: >
      Evaluate whether the chatbot addresses all user intentions across the
      conversation. For EACH user intention, determine if the chatbot:
      (A) Fulfilled it directly with data — classify as MET.
      (B) Could not fulfill it because the data is genuinely unavailable in
      the Data360/World Bank API, BUT the chatbot: (i) explicitly stated the
      data gap, (ii) explained WHY it's missing, (iii) suggested alternative
      data sources or approaches. This is CORRECT BEHAVIOR per the product
      spec and should be classified as PARTIALLY MET (not failed).
      (C) Ignored the intention, gave a vague non-answer, or fabricated data
      — classify as UNMET.
      IMPORTANT: The chatbot is constrained to a specific data API (Data360 /
      World Bank). When that API genuinely lacks data for a country, time
      period, or indicator, the chatbot MUST NOT fabricate values. Instead,
      graceful handling (explain gap + suggest alternatives) is the expected
      behavior and should NOT be penalized as a failure.
    evaluation_steps:
      - "Identify all user intentions across the conversation"
      - >
        For each intention, classify as:
        MET (data provided), PARTIALLY MET (data unavailable but gap
        explained + alternatives suggested), or UNMET (ignored/vague/fabricated)
      - "Score = (MET count + 0.5 * PARTIALLY_MET count) / total intentions"
      - >
        If all unmeetable intentions were handled with explicit gap
        explanation + alternatives, the minimum score should be 0.5
    rubric:
      - score_range: [9, 10]
        expected_outcome: "All user intentions fully met with data."
      - score_range: [7, 8]
        expected_outcome: "Most intentions met; any gaps handled gracefully with explanation + alternatives."
      - score_range: [5, 6]
        expected_outcome: "Some intentions met, some gaps handled gracefully, minor issues."
      - score_range: [3, 4]
        expected_outcome: "Multiple unmet intentions without proper gap explanation or alternatives."
      - score_range: [0, 2]
        expected_outcome: "Most intentions unmet, no gap handling, or data fabricated."


# ── Per-Turn Metrics ─────────────────────────────────────────────
# Evaluated on each assistant turn individually (using GEval on
# LLMTestCase). Per-turn scores are aggregated to conversation-level.
#
# Pre-filtering via `requires` field:
#   tool_data       — skip if turn has no tool-retrieved data
#   claim_data      — skip if turn has no <claim> tags
#   presented_data  — skip if turn has no numeric data (claims or tables)
#   data_gap        — skip if turn has no data unavailability
#   comparison      — skip if turn has no cross-country/time comparison
#   technical_terms — skip if turn has no technical terms/acronyms
#   prior_context   — skip on first turn (nothing to retain)
#   routing         — always applicable (every turn has routing)
#   tool_calls      — skip if turn has no structured tool call trace
#
# Additional flags:
#   skip_on_deliverable — skip when user requests a specific format
#     (bullet points, slide decks, summaries, drafts). Deliverable
#     turns correctly omit structural elements like section labels.
#
# Aggregation:
#   aggregates_to — name of the conversation-level aggregated score
#   aggregation   — min (strictest turn) or mean (average quality)
#
# Threshold tiers:
#   0.8  — Strict (hard accuracy: Data Accuracy, Claim Tagging)
#   0.5-0.6 — Medium (core functionality: tool use, context, routing)
#   0.4  — Lenient (quality/polish: structure, formatting, disclosure)

per_turn_metrics:
  # ── Data Trust ─────────────────────────────────────────────────

  - name: "Per-Turn Data Accuracy"
    type: "geval"
    threshold: 0.9
    requires: "tool_data"
    aggregates_to: "Data Accuracy"
    aggregation: "min"
    criteria: >
      You are evaluating a SINGLE assistant turn. You are given:
      - PRIOR CONTEXT: structured summary of prior turns including
        indicators, databases, claim_ids, and data values retrieved.
      - CURRENT ASSISTANT OUTPUT: the response for this turn.

      Evaluate whether numerical values in THIS turn are accurate:
      (1) The chatbot must NEVER fabricate, guess, or approximate
      numbers. If data is unavailable, it must say so explicitly.
      (2) Values must match the correct REF_AREA (country) and
      TIME_PERIOD (year) from tool output — cross-check that each
      value belongs to the right row.
      (3) Entity names must match tool output exactly — never
      substitute common aliases.
      (4) Correctly refusing to provide data for invalid requests
      IS accurate behavior and should score highly.

    evaluation_steps:
      - "For each value, verify it matches the correct country and year from tool output"
      - "Check entity names match tool output exactly"
      - "Check for fabricated or guessed numbers"
    rubric:
      - score_range: [8, 10]
        expected_outcome: "All values accurate with correct country/year matching."
      - score_range: [4, 7]
        expected_outcome: "Some values mismatched to wrong country/year."
      - score_range: [0, 3]
        expected_outcome: "Values fabricated, guessed, or significantly wrong."

  - name: "Per-Turn Claim Consistency"
    type: "geval"
    threshold: 0.8
    requires: "claim_data"
    aggregates_to: "Claim Tagging & PCN"
    aggregation: "min"
    criteria: >
      You are evaluating a SINGLE assistant turn. You are given:
      - PRIOR CONTEXT: structured summary of prior turns including
        claim_ids and their associated values.
      - CURRENT ASSISTANT OUTPUT: the response for this turn.

      Evaluate claim tag correctness for THIS turn only:
      (1) Every numeric value retrieved from tool calls in THIS turn
      must be enclosed in <claim id="claim_id" policy="auto">value
      </claim> tags — no untagged tool-retrieved numbers.
      (2) The claim_id must match the EXACT claim_id from the tool
      output — never invented or generic.
      (3) If this turn references a numeric value that was ALREADY
      presented in a prior turn (from the prior context), the
      assistant MUST reuse the SAME claim_id — not generate a new
      one for the same data point.
      (4) Both 'id' and 'policy' attributes are required.

    evaluation_steps:
      - >
        For each numeric value, verify it is wrapped in <claim> tags
        with correct id and policy attributes.
      - >
        Cross-reference claim_ids against tool output from THIS turn
        to verify they match exactly.
      - >
        Check if any values also appeared in prior turns. If so,
        verify the SAME claim_id is reused.
    rubric:
      - score_range: [8, 10]
        expected_outcome: "All or nearly all values correctly claim-tagged with proper IDs."
      - score_range: [4, 7]
        expected_outcome: "Some values untagged or with incorrect/invented claim_ids."
      - score_range: [0, 3]
        expected_outcome: "Most values untagged, or claim tags used on fabricated data."

  # ── Context & Retention ────────────────────────────────────────

  - name: "Per-Turn Context Retention"
    type: "geval"
    threshold: 0.6
    requires: "prior_context"
    aggregates_to: "Context Retention"
    aggregation: "min"
    criteria: >
      You are evaluating a SINGLE assistant turn. You are given:
      - PRIOR CONTEXT: structured summary of prior turns including
        indicator_ids, database_ids, claim_ids with their values,
        countries queried, and data availability status.
      - CURRENT USER INPUT: the user's question for this turn.
      - CURRENT ASSISTANT OUTPUT: the assistant's response for this turn.

      Evaluate whether THIS turn correctly retains and reuses
      information from prior context:
      (1) If the user references or builds on prior data (e.g.,
      "compare with Kenya", "now break it down by gender"), does the
      assistant reuse the indicator_id and database_id from prior
      tool calls? Or did it re-search unnecessarily?
      (2) DATA TRUST: If the assistant references a numeric value from
      a prior turn, does it reuse the SAME claim_id? Inventing a new
      claim_id for an already-presented value breaks data provenance.
      (3) CONSISTENCY: If a prior turn stated "data not available for
      Kenya", a follow-up turn must maintain that assertion — not
      contradict it or silently fabricate the missing data.
      (4) Does the assistant avoid re-asking questions the user already
      answered in prior turns (e.g. asking for a time period, year,
      geographic scope, or country when the user just provided it in
      the previous turn)? Re-asking for established context is a failure.

    evaluation_steps:
      - >
        Check the assistant's tool calls: did it re-search for an
        indicator already resolved in prior turns? If so, penalize.
      - >
        Check if numeric values from prior turns are referenced with
        the SAME claim_id (data provenance check).
      - >
        Check consistency: if prior context says data was unavailable,
        does this turn maintain that assertion?
      - >
        CRITICAL: Check if the assistant asks the user for information
        (like year, country, or scope) that was ALREADY established
        in prior context. If it does, score 3 or lower immediately.
    rubric:
      - score_range: [8, 10]
        expected_outcome: "Correctly retains context, reuses IDs and claim_ids, maintains consistency, and DOES NOT re-ask for known context."
      - score_range: [4, 7]
        expected_outcome: "Partially retains context — re-searches or misses some prior data."
      - score_range: [0, 3]
        expected_outcome: "Ignores prior context, invents new claim_ids, or contradicts prior assertions."

  # ── Data Gap Handling ──────────────────────────────────────────

  - name: "Per-Turn Data Gap Handling"
    type: "geval"
    threshold: 0.5
    requires: "data_gap"
    aggregates_to: "Data Gap Handling"
    aggregation: "min"
    criteria: >
      You are evaluating a SINGLE assistant turn where data was
      unavailable for at least one requested item. You are given:
      - PRIOR CONTEXT: structured summary including what data was
        and was not available in prior turns.
      - CURRENT ASSISTANT OUTPUT: the response for this turn.

      Evaluate whether THIS turn handles the data gap correctly:
      (1) Explicitly states what data is missing and why (e.g.,
      "No recent literacy data for Kenya in WDI for 2019-2024").
      (2) Never silently skips missing data or substitutes fabricated
      values.
      (3) Explains what data IS available as an alternative (e.g.,
      different indicator, older years, coarser disaggregation).
      (4) Suggests actionable next steps.
      (5) When falling back to a different level of data, clearly
      notes the gap between requested and provided.

    evaluation_steps:
      - "Check if the chatbot explicitly stated what data is missing"
      - "Verify no data was silently skipped or fabricated"
      - "Check if alternatives were suggested"
      - "Check if actionable next steps were provided"
    rubric:
      - score_range: [8, 10]
        expected_outcome: "Gap explicitly stated with explanation and alternatives."
      - score_range: [4, 7]
        expected_outcome: "Gap noted but missing explanation or alternatives."
      - score_range: [0, 3]
        expected_outcome: "Gap silently skipped, fabricated, or no alternatives."

  # ── Comparability ──────────────────────────────────────────────

  - name: "Per-Turn Comparability Warnings"
    type: "geval"
    threshold: 0.4
    requires: "comparison"
    aggregates_to: "Comparability Warnings"
    aggregation: "min"
    criteria: >
      You are evaluating a SINGLE assistant turn that compares data
      across countries, time periods, or sources. You are given:
      - PRIOR CONTEXT: structured summary including ref_areas and
        time_periods from prior turns.
      - CURRENT ASSISTANT OUTPUT: the response for this turn.

      Evaluate whether THIS turn warns about comparability issues:
      (1) Different TIME PERIODS (e.g., Ethiopia 2022 vs Kenya 2018)
      — the year difference must be noted.
      (2) Different DATABASES or METHODOLOGIES — note the difference.
      (3) Different DEFINITIONS (e.g., gross vs net enrollment) —
      explain the conceptual difference.
      (4) Differing values from multiple sources — note discrepancy.

    evaluation_steps:
      - "Identify comparisons in this turn (cross-country, cross-time)"
      - "Check if time period differences are noted"
      - "Check if methodology/definition differences are flagged"
    rubric:
      - score_range: [8, 10]
        expected_outcome: "All comparability issues flagged with clear warnings."
      - score_range: [4, 7]
        expected_outcome: "Some warnings present but incomplete."
      - score_range: [0, 3]
        expected_outcome: "Comparisons without required warnings."

  # ── Response Quality ───────────────────────────────────────────

  - name: "Per-Turn Content Structure"
    type: "geval"
    threshold: 0.4
    requires: "tool_data"
    aggregates_to: "Content Structure"
    aggregation: "mean"
    skip_on_deliverable: true  # Slide decks, summaries, drafts omit section labels
    criteria: >
      You are evaluating a SINGLE assistant turn that presents
      tool-retrieved data. Evaluate response structure:
      (1) Factual data (figures from tools) is in a clearly labeled
      section, distinct from interpretation.
      (2) Analysis or interpretation is separated from raw data.
      (3) Caveats, limitations, or quality flags are addressed
      somewhere in the response (in any section: Note, Sources,
      Limitations, or inline). They do NOT need a dedicated
      'Limitations:' heading if covered elsewhere.
      (4) Comparability warnings when applicable.
      (5) Clear distinction between factual data (from tools),
      derived analysis (computed), and AI interpretation.

    evaluation_steps:
      - "Check that data and analysis are in separate, labeled sections"
      - "Check that caveats or limitations are addressed somewhere in the response (any section counts)"
      - "Check that facts, analysis, and interpretation are clearly separated"
    rubric:
      - score_range: [8, 10]
        expected_outcome: "Clear structural separation of data, analysis, and context. Caveats addressed."
      - score_range: [4, 7]
        expected_outcome: "Some separation but data and analysis partially mixed, or caveats not addressed."
      - score_range: [0, 3]
        expected_outcome: "No structure despite presenting tool data."

  - name: "Per-Turn Follow-up Suggestions"
    type: "geval"
    threshold: 0.4
    requires: "tool_data"
    aggregates_to: "Follow-up Suggestions"
    aggregation: "min"
    skip_on_deliverable: true  # Deliverable outputs correctly omit follow-ups
    criteria: >
      You are evaluating a SINGLE assistant turn that presents data.
      (1) Must end with a 'Suggested follow-ups:' section with 2-3
      user-phrased questions (e.g., 'What is GDP for Kenya?').
      (2) NEVER use 'Would you like me to…' or 'Shall I…' phrasing.
      (3) Section label must be 'Suggested follow-ups:'.

    evaluation_steps:
      - "Check for 'Suggested follow-ups:' section"
      - "Verify questions are user-phrased"
    rubric:
      - score_range: [8, 10]
        expected_outcome: "Follow-ups present with proper user-phrased questions."
      - score_range: [4, 7]
        expected_outcome: "Follow-ups present but wrong phrasing or label."
      - score_range: [0, 3]
        expected_outcome: "No follow-ups despite presenting data."

  - name: "Per-Turn Latest Data Note"
    type: "geval"
    threshold: 0.4
    requires: "tool_data"
    aggregates_to: "Latest Data Note"
    aggregation: "min"
    criteria: >
      You are evaluating a SINGLE assistant turn that presents data.
      (1) When the user did NOT specify a time period and the chatbot
      uses latest available data, it should note this explicitly.
      (2) If the user asked for a specific year, no note needed.
      (3) If a requested year has no data, state 'Data not available'.

    evaluation_steps:
      - "Check if user specified a year in their request"
      - "If not, verify 'latest available data' note or year mentioned"
    rubric:
      - score_range: [8, 10]
        expected_outcome: "Latest data note present or user specified year."
      - score_range: [4, 7]
        expected_outcome: "Data presented without clear year context."
      - score_range: [0, 3]
        expected_outcome: "Data presented with no time period mention."

  - name: "Per-Turn Source Citation"
    type: "geval"
    threshold: 0.6
    requires: "tool_calls"
    aggregates_to: "Source Citation"
    aggregation: "min"
    criteria: >
      You are evaluating a SINGLE assistant turn that presents data.
      (1) Must end with a 'Sources:' section listing database name,
      indicator name, and methodology note.
      (2) Format: **Database name** — Indicator name — methodology note.
      (3) Use bullet points for multiple sources.

    evaluation_steps:
      - "Check for 'Sources:' section"
      - "Verify citation format"
    rubric:
      - score_range: [8, 10]
        expected_outcome: "Sources section present with correct format."
      - score_range: [4, 7]
        expected_outcome: "Sources present but incomplete."
      - score_range: [0, 3]
        expected_outcome: "No Sources section despite presenting data."

  - name: "Per-Turn Data Formatting"
    type: "geval"
    threshold: 0.4
    requires: "tool_data"
    aggregates_to: "Data Formatting"
    aggregation: "min"
    skip_on_deliverable: true  # Slide decks, bullet points don't need tables
    criteria: >
      You are evaluating a SINGLE assistant turn that presents data.
      (1) All numeric values must include units (%, USD, years).
      (2) Use markdown tables for 3+ related values.
      (3) Never use scientific notation.
      (4) Lead with a 1-2 sentence insight, then details.

    evaluation_steps:
      - "Check if values include units"
      - "For 3+ values, verify markdown tables"
      - "Check for scientific notation"
    rubric:
      - score_range: [8, 10]
        expected_outcome: "Well-formatted with units, tables, no scientific notation."
      - score_range: [4, 7]
        expected_outcome: "Some formatting issues."
      - score_range: [0, 3]
        expected_outcome: "Poor formatting — no units, no tables, or scientific notation."

  - name: "Per-Turn Derived Data Integrity"
    type: "geval"
    threshold: 0.8
    requires: "presented_data" # Triggers when numeric data (claims or tables) is present
    aggregates_to: "Derived Data Integrity"
    aggregation: "min"
    criteria: >
      You are evaluating a SINGLE assistant turn that performs math or
      derives insights from tool-retrieved data. You are given the
      raw tool values and the assistant's response.

      Evaluate the mathematical accuracy of derived values:
      (1) CALCULATIONS: If the assistant calculates growth rates,
      differences, or sums (e.g., "This represents a 15% increase"),
      the math must be correct based on the tool-retrieved numbers.
      (2) PRECISION: Rounded values must be accurate to the specified
      decimal places (default +/- 0.01 tolerance).
      (3) LOGIC: Comparison logic (e.g., "X is higher than Y") must
      be factually correct based on tool output.
      (4) NO HALLUCINATION: The assistant must not "fabricate" a
      calculation that isn't supported by the data.

    evaluation_steps:
      - "Re-calculate any growth rates, differences, or sums mentioned in the summary or analysis"
      - "Verify the math matches the tool-retrieved numbers exactly"
      - "Check that directional insights (higher/lower/increase) are correct"
    rubric:
      - score_range: [9, 10]
        expected_outcome: "Perfectly accurate math and logical derivations."
      - score_range: [6, 8]
        expected_outcome: "Correct logic but minor rounding errors or lack of precision."
      - score_range: [0, 5]
        expected_outcome: "Significant mathematical errors, wrong directions, or fabricated calculations."


  # ── Accessibility & Learning ───────────────────────────────────

  - name: "Per-Turn Inline Explanations"
    type: "geval"
    threshold: 0.4
    requires: "technical_terms"
    aggregates_to: "Inline Explanations"
    aggregation: "mean"
    criteria: >
      You are evaluating a SINGLE assistant turn that uses technical
      terms or indicator names. Evaluate:
      (1) Technical indicator names (e.g., 'gross enrollment ratio')
      should include a brief plain-language explanation on first use.
      (2) Statistical concepts should be defined on first use.
      (3) Acronyms expanded on first use (e.g., WDI = World
      Development Indicators).
      (4) Explanations should be concise and inline.

    evaluation_steps:
      - "Identify technical terms, indicator names, or acronyms"
      - "Check if plain-language explanation provided on first use"
      - "Verify explanations are inline and concise"
    rubric:
      - score_range: [8, 10]
        expected_outcome: "All or most terms explained inline."
      - score_range: [4, 7]
        expected_outcome: "Some terms explained, others left unexplained."
      - score_range: [0, 3]
        expected_outcome: "Technical terms used without explanation."

  - name: "Per-Turn Progressive Disclosure"
    type: "geval"
    threshold: 0.4
    requires: "tool_data"
    aggregates_to: "Progressive Disclosure"
    aggregation: "mean"
    criteria: >
      You are evaluating a SINGLE assistant turn that presents data.
      (1) Lead with a 1-2 sentence summary or key insight BEFORE
      detailed numbers/tables.
      (2) Don't overwhelm with all data at once.
      (3) Offer drill-down via follow-up questions.
      (4) For broad questions, start with the most relevant indicator.

    evaluation_steps:
      - "Check if response starts with a summary/insight"
      - "Verify the response doesn't dump excessive data"
      - "Check if drill-down offered via follow-ups"
    rubric:
      - score_range: [8, 10]
        expected_outcome: "Leads with insight, progressive structure, offers drill-down."
      - score_range: [4, 7]
        expected_outcome: "Some structure but missing summary or too much data upfront."
      - score_range: [0, 3]
        expected_outcome: "Data dumped without summary or structure."

  # ── Tool-Use Evaluation ─────────────────────────────────────────

  - name: "Per-Turn Tool Selection"
    type: "geval"
    threshold: 0.5
    requires: "tool_calls"
    aggregates_to: "Tool Selection"
    aggregation: "mean"
    criteria: >
      You are evaluating a SINGLE assistant turn. You are given:
      - CURRENT USER INPUT: the user's question for this turn.
      - Tool Sequence and Tool Call details (tool names and arguments).
      - CURRENT ASSISTANT OUTPUT: the response for this turn.

      The available MCP tools are: data360_search_indicators (discover
      indicators by topic), data360_get_data (fetch indicator data),
      data360_get_viz_spec (generate charts), data360_find_codelist_value
      (resolve country/region names to codes), data360_get_metadata
      (indicator metadata), data360_get_disaggregation (available
      breakdowns), data360_get_data_api_url (direct API URL),
      data360_get_supported_chart_types (chart type guidance),
      data360_list_indicators (list all indicators in a database).

      Evaluate whether the correct tools were selected for this turn:
      (1) Data retrieval questions should use search_indicators then
      get_data. Chart requests should include get_viz_spec. Codelist
      lookups should use find_codelist_value for ambiguous names.
      (2) No hallucinated tools — all called tools must be from the
      list above.
      (3) No unnecessary tools — avoid calling tools that don't
      contribute to answering the user's question.
      (4) No skipped critical tools — e.g., if the user asks for
      data, search_indicators and get_data should both be called.

    evaluation_steps:
      - "List the tools called and compare against the user's intent"
      - "Check all tool names are real MCP tools from the list above"
      - "Identify any missing tools that should have been called"
      - "Identify any unnecessary tools that add no value"
    rubric:
      - score_range: [8, 10]
        expected_outcome: "All correct tools called, no hallucinated or unnecessary tools."
      - score_range: [4, 7]
        expected_outcome: "Most tools correct but one missing or unnecessary tool."
      - score_range: [0, 3]
        expected_outcome: "Wrong tools, hallucinated tool names, or critical tools skipped."

  - name: "Per-Turn Tool Sequencing"
    type: "geval"
    threshold: 0.5
    requires: "tool_calls"
    aggregates_to: "Tool Sequencing"
    aggregation: "min"
    criteria: >
      You are evaluating a SINGLE assistant turn. You are given:
      - Tool Sequence: the ordered list of tool calls made.
      - Tool Call details with arguments.

      Evaluate whether tools were called in a logical order:
      (1) DISCOVERY BEFORE DATA: search_indicators should be called
      BEFORE get_data — never fetch data without first knowing the
      correct indicator_id and database_id.
      (2) CODELIST BEFORE DATA: find_codelist_value should be called
      BEFORE get_data when the country name is ambiguous (e.g.,
      "Congo", non-English names, abbreviations).
      (3) METADATA/DISAGGREGATION BEFORE FILTERED DATA:
      get_disaggregation or get_metadata should come before get_data
      when the query requires specific breakdowns (by sex, age, etc.).
      (4) CHART TYPE BEFORE CHART: get_supported_chart_types may
      precede get_viz_spec for chart type selection, but this is
      optional.
      (5) If only 1 tool is called, sequencing is trivially correct.

    evaluation_steps:
      - "Check if search_indicators precedes get_data"
      - "Check if find_codelist_value precedes get_data for ambiguous countries"
      - "Check if get_disaggregation precedes get_data for filtered queries"
      - "Flag any cases where data is fetched before discovery"
    rubric:
      - score_range: [8, 10]
        expected_outcome: "Tools called in correct logical order."
      - score_range: [4, 7]
        expected_outcome: "Minor ordering issue but data still retrieved correctly."
      - score_range: [0, 3]
        expected_outcome: "Data fetched before discovery, or major ordering violation."

  - name: "Per-Turn Argument Quality"
    type: "geval"
    threshold: 0.5
    requires: "tool_calls"
    aggregates_to: "Argument Quality"
    aggregation: "min"
    criteria: >
      You are evaluating a SINGLE assistant turn. You are given:
      - Tool Call details with tool name, arguments, and results.
      - CURRENT USER INPUT and ASSISTANT OUTPUT.

      Evaluate whether tool arguments are well-formed and semantically
      correct:
      (1) COUNTRY CODES: REF_AREA and country_code values should be
      valid 3-letter ISO codes (e.g., KEN for Kenya, USA for United
      States). Never use full country names in code fields.
      (2) INDICATOR IDs: indicator_id values should match the format
      returned by search_indicators (e.g., WB_WDI_NY_GDP_PCAP_CD).
      Never invent indicator IDs.
      (3) DATABASE IDs: database_id should match the indicator's
      source database (e.g., WB_WDI, WB_HNP). Never guess.
      (4) QUERY STRINGS: Search queries should be specific and
      relevant to the user's question (e.g., "GDP per capita" not
      just "GDP" when the user asked about per-capita).
      (5) FILTER VALUES: Disaggregation filters (SEX, AGE, etc.)
      should use valid codes (e.g., "F", "M", "_T").

    evaluation_steps:
      - "Check country codes are valid 3-letter ISO codes"
      - "Check indicator_id and database_id formats are plausible"
      - "Verify search queries are specific to the user's intent"
      - "Check disaggregation filter values are valid codes"
    rubric:
      - score_range: [8, 10]
        expected_outcome: "All arguments well-formed with correct codes and specific queries."
      - score_range: [4, 7]
        expected_outcome: "Some arguments correct but a minor issue (vague query, wrong format)."
      - score_range: [0, 3]
        expected_outcome: "Hallucinated IDs, invalid codes, or completely wrong arguments."

  - name: "Per-Turn Routing Correctness"
    type: "geval"
    threshold: 0.5
    requires: "routing"
    aggregates_to: "Routing Correctness"
    aggregation: "min"
    criteria: >
      You are evaluating a SINGLE assistant turn. You are given:
      - Routing classification (RESEARCH or DIRECT).
      - CURRENT USER INPUT and ASSISTANT OUTPUT.
      - Tool Sequence (if any tools were called).

      Evaluate whether the routing classification is correct:
      (1) RESEARCH: User asks for data, indicators, charts, comparisons,
      methodology, analysis, or any question that requires tool calls
      to retrieve information from the Data360 API.
      (2) DIRECT: User sends a greeting, asks a general question not
      requiring data, or makes an out-of-scope request.
      (3) CONSISTENCY: If routing is DIRECT but tools were called,
      that indicates a routing error. If routing is RESEARCH but no
      tools were called, that may indicate the user's question was
      actually simple/direct.
      (4) If routing information is not available (e.g., "(via HTTP)"),
      score based on whether the tool usage pattern is consistent
      with the user's intent.

    evaluation_steps:
      - "Classify the user's intent: does it require data retrieval?"
      - "Check the routing classification matches the intent"
      - "Verify consistency between routing and tool usage"
    rubric:
      - score_range: [8, 10]
        expected_outcome: "Routing matches user intent and is consistent with tool usage."
      - score_range: [4, 7]
        expected_outcome: "Borderline case — intent is ambiguous but routing is reasonable."
      - score_range: [0, 3]
        expected_outcome: "Clearly wrong routing — data question routed as DIRECT or vice versa."

  - name: "Per-Turn Visualization & API URLs"
    type: "geval"
    threshold: 0.6
    requires: "visualization"
    aggregates_to: "Visualization & API URLs"
    aggregation: "min"
    criteria: >
      You are evaluating a SINGLE assistant turn. You are given:
      - Tool Sequence and Tool Call details (tool names and arguments).
      - CURRENT USER INPUT and ASSISTANT OUTPUT.
      - Programmatic verification signals (when applicable):
        * "Viz Request: YES" = user asked for a chart/visualization.
        * "get_viz_spec Called: YES/NO" = whether the tool was called.
        * "Viz URL From Tool: <url>" = the URL returned by the tool.
        * "Viz URL In Response: VERIFIED/MISSING" = whether the
          tool's URL appears in the assistant's response.

      Strict Evaluation Rules for scoring:
      (a) VISUALIZATION: When "Viz Request: YES" and "get_viz_spec
      Called: YES" and "Viz URL In Response: VERIFIED", score 10
      -- only if the chart configuration matches the request.
      (b) INTENT MISMATCH: If the user asked for a "combined" or
      "stacked" chart but the asssitant gave separate or wrong chart
      types, score 4-6 -- even if URLs are present. Partial fulfillment
      of a specific visualization requirement is NOT a perfect score.
      (c) SILENT REJECTION / APOLOGY: When "Viz Request: YES" but the
      assistant apologizes or claims it cannot generate the link
      WITHOUT a clear technical error (e.g., get_viz_spec Called: NO),
      score 0-3 -- this is a failure of intent fulfillment.
      (d) TOOL ERROR: If get_viz_spec returned an error and the
      assistant apologized correctly, score 5-7.
      (e) API URL: When the user asks for API access, verify
      a URL under 'Direct API Access:'. Do not expect API URLs
      on every response -- only when explicitly requested.
      (f) If the user did NOT ask for a chart or API URL on this
      turn, this metric is trivially satisfied -- score 10.

    evaluation_steps:
      - "Check if 'Viz Request: YES' is present in the context"
      - "If yes, verify 'get_viz_spec Called' and 'Viz URL In Response'"
      - "Evaluate if the chart configuration (combined vs separate) matches the user intent"
      - "Check for 'silent rejections' or apologies without technical cause"
    rubric:
      - score_range: [8, 10]
        expected_outcome: "Viz request handled correctly (URL VERIFIED) with exact intent match."
      - score_range: [4, 7]
        expected_outcome: "Intent mismatch (separate charts for combined request), or get_viz_spec called but URL missing."
      - score_range: [0, 3]
        expected_outcome: "Viz requested but ignored, apologized for, or get_viz_spec NOT called."

  # ── Narrator Fidelity Metrics (feat/compact-agg-renderers) ────────────────
  # These two metrics target narrator-side failures specific to the compact
  # aggregation output format. Run via suite_agentic_flow.yaml.
  # Both use requires: "tool_calls" which maps to has_tool_calls in per_turn_eval.py.

  - name: "Per-Turn Narrator Claim Fabrication"
    type: "geval"
    threshold: 0.9
    requires: "tool_calls"
    aggregates_to: "Narrator Claim Fabrication"
    aggregation: "min"
    criteria: >
      You are evaluating a SINGLE assistant turn. You are given:
        - Tool call details with tool names, arguments, and RESULTS
          (including claim_id fields in each tool output row/entry).
        - CURRENT ASSISTANT OUTPUT with <claim id="..."> tags.
        - PRIOR CONTEXT showing tool outputs from previous turns (if any).

      Evaluate whether EVERY claim_id in the assistant's response exists
      in the tool output from THIS turn or a prior turn in context.

      FABRICATED (score low):
        A <claim id="XYZ"> tag appears in the response, but "XYZ" does
        NOT appear anywhere in any tool output result (neither this turn
        nor prior turns). Common fabrication patterns:
        - Sequential numeric suffixes: c1, c2, c3, c4, c5, c6, ...
          These are placeholder IDs the LLM invented, not real PCN UUIDs.
        - Hex-looking strings that do not match any claim_id in tool output.
        Any fabricated ID indicates the Narrator ignored the RAW TOOL
        RESULTS and generated claim tags from its own knowledge.

      CORRECT (score high):
        Every claim_id in the response can be traced to a specific tool
        output result. The claim_id matches exactly (character for character).

      If no <claim> tags appear in the response, score 5 (ambiguous:
      the Narrator may have correctly omitted tags for derived values,
      or it may have failed to tag required values).

    evaluation_steps:
      - >
        Extract all claim_ids from the assistant response by scanning
        for <claim id="..."> patterns. List each unique ID found.
      - >
        Build the set of VALID claim_ids by extracting claim_id values from:
        (a) the tool output results in THIS CURRENT TURN (highest priority),
        and (b) all prior turns visible in context.
        IMPORTANT: If a new tool call was made this turn (e.g., fetching data
        for a second country), its results contain NEW valid claim_ids that
        will NOT have appeared in prior turns. These are correct, not fabricated.
        Include ALL claim_ids from THIS turn's tool results in the valid set
        before checking prior turns.
      - >
        For each response claim_id, check: does it exist in the valid set?
        If not, flag it as fabricated.
      - >
        Special check: does any response claim_id match the pattern
        /^c\d+$/ (e.g., c1, c2, c3)? These are always fabricated --
        real PCN claim_ids are hex UUIDs, never sequential labels.
        Also flag any ID that looks like an indicator code (e.g.,
        WB_WDI_NY_GDP_PCAP_KD) -- these are never valid claim_ids.
      - >
        Compute ratio of valid (traceable) claim_ids to total claim_ids
        in the response. Score accordingly.
    rubric:
      - score_range: [9, 10]
        expected_outcome: >
          Every claim_id in the response traces to a real tool output entry.
          No fabricated or sequential-pattern IDs present.
      - score_range: [4, 8]
        expected_outcome: >
          Most claim_ids are valid, but 1-2 cannot be found in any tool
          output or match a fabrication pattern.
      - score_range: [0, 3]
        expected_outcome: >
          Multiple claim_ids do not exist in any tool output. Sequential
          patterns like c1, c2, c3 are a clear indicator of this failure.

  - name: "Per-Turn Ranking Fidelity"
    type: "geval"
    threshold: 0.8
    requires: "tool_calls"
    aggregates_to: "Ranking Fidelity"
    aggregation: "min"
    criteria: >
      You are evaluating a SINGLE assistant turn where rank_countries
      or compare_countries (snapshot) was called. You are given:
        - Tool call details including the rankings array or snapshot
          returned by the tool.
        - CURRENT ASSISTANT OUTPUT with a table or list of ranked values.

      Evaluate whether the Narrator faithfully reproduced the ranking
      order and values from the tool output.

      DRIFT (score low):
        - Countries appear in a DIFFERENT ORDER than the tool output's
          rankings array (e.g., the highest-value country presented as lowest).
        - Values differ from what the tool returned -- wrong numbers, wrong
          country assigned to a value, or values transposed between countries.
          Acceptable: minor display formatting (1000 -> 1,000, consistent rounding).
        - Countries in the tool output's top-N are missing without explanation.
        - The response contains two or more ranking tables/lists with DIFFERENT
          values for the same turn (dual contradictory outputs).

      FAITHFUL (score high):
        - Country order matches the tool output exactly.
        - Values match the tool output (display formatting differences acceptable).
        - All top-N countries from the tool output are present.
        - Only one ranking table or list appears in the response.

      If rank_countries or compare_countries was not called in this turn,
      this metric is trivially satisfied. Score 10.

    evaluation_steps:
      - >
        Check if rank_countries or compare_countries was called. If not, score 10.
      - >
        Extract the ranking order from the tool output (rankings array,
        ordered by rank field). Note each country code and obs_value.
      - >
        Extract the ranking order from the assistant response (table rows
        or bullet list entries). Note each country and value.
      - >
        Compare order and values. Flag reordering, value changes, or transpositions.
      - >
        Check for dual contradictory ranking blocks in the same response.
    rubric:
      - score_range: [9, 10]
        expected_outcome: >
          Ranking order, values, and country set match the tool output exactly.
          Only one ranking presentation. Display formatting differences acceptable.
      - score_range: [4, 8]
        expected_outcome: >
          Minor discrepancies: 1-2 values rounded differently, or one position
          swapped. No value transposition between countries.
      - score_range: [0, 3]
        expected_outcome: >
          Significant ranking drift: wrong ordering (e.g., highest-value country
          presented as lowest), fabricated values, values transposed between
          countries, or two contradictory ranking tables in the same response.

  - name: "Per-Turn Research-Narrator Transcription Fidelity"
    type: "geval"
    threshold: 0.8
    requires: "tool_calls"
    aggregates_to: "Research-Narrator Transcription Fidelity"
    aggregation: "min"
    criteria: >
      You are evaluating a SINGLE assistant turn. You are given:
        - Tool call details with tool names, arguments, and complete RESULTS
          (the raw payload returned by each tool call for this turn).
        - CURRENT ASSISTANT OUTPUT: what the narrator wrote to the user.

      Your task is a VALUE-BY-VALUE FIDELITY check.

      For every numeric figure that appears in the assistant's output
      (percentages, counts, dollar amounts, ranks, years, rates, etc.),
      determine whether that exact value is present in the tool result
      payloads for this turn.

      TRANSCRIPTION ERROR (score low):
        A number appears in the assistant's output that does NOT match
        any value in the tool results for this turn. This includes:
        - Wrong value for a country (e.g., tool says 10.4 but narrator
          says 3.8 for the same country and year).
        - Value assigned to wrong entity (e.g., Nepal's value reported
          under Bangladesh).
        - Values that appear to be fabricated (no match anywhere in the
          tool payload, not even in a different country's row).
        - Summary statistics (e.g., "average of 5.2%") that cannot be
          derived from the tool payload values.

        CRITICAL MULTI-TURN RULE: Do NOT flag a value as an error or transposition
        if it differs from a PRIOR turn, as long as it matches a tool result in
        THIS CURRENT TURN. New tool calls in the current turn often fetch newer
        or different data. The current turn's tool output is the absolute ground truth.

      FAITHFUL TRANSCRIPTION (score high):
        Every numeric value in the assistant output is present in the
        tool result payload for the corresponding country/year/entity.
        Minor acceptable differences:
        - Rounding (3.778 shown as 3.8 is acceptable).
        - Formatting (1000 shown as 1,000 is acceptable).

      If no numeric values appear in the tool results (e.g., the tool
      returned an error or the turn was CLARIFY), score 10 (not applicable).

      If the assistant output has no numeric figures at all (purely
      qualitative response), score 10 (not applicable).

    evaluation_steps:
      - >
        Scan the tool result payloads for this turn and collect all
        numeric values with their associated entity labels (country name
        or code, year, indicator). Build a lookup table:
        entity+year -> value.
      - >
        Scan the assistant output and extract every numeric value along
        with its surrounding entity label (what country/year does the
        narrator associate with this number?).
      - >
        For each narrator value, check: does it match (within rounding)
        a value in the tool payload for the same entity? Flag mismatches.
      - >
        Check for entity-value transpositions: is a value from entity A
        being reported under entity B?
      - >
        Compute: (correctly transcribed values) / (total narrator numeric
        values). Apply penalty for transpositions (they are more severe
        than simple wrong values since they actively mislead the user).
    rubric:
      - score_range: [9, 10]
        expected_outcome: >
          Every numeric value in the narrator output matches the tool payload
          exactly (within rounding). No transpositions, no fabricated values.
      - score_range: [5, 8]
        expected_outcome: >
          Most values are correct but 1-2 minor mismatches exist (wrong
          rounding, one value off). No transpositions.
      - score_range: [0, 4]
        expected_outcome: >
          Multiple values don't match tool payload, OR at least one
          transposition detected (value from country A reported under
          country B), OR narrator presents values with no correspondence
          to any entry in the tool result.

  - name: "Per-Turn Unnecessary Clarification"
    type: "geval"
    threshold: 0.8
    requires: "routing"
    aggregates_to: "Unnecessary Clarification"
    aggregation: "min"
    criteria: >
      You are evaluating a SINGLE assistant turn to determine whether
      the chatbot asked the user an unnecessary clarification question
      when it had the tools to resolve the ambiguity itself.

      The system has access to:
        - data360_find_codelist_value: resolves natural-language names
          to standard codes (e.g., "South Asia" -> "SAS", "Kenya" -> "KEN")
        - data360_expand_country_group: expands a group code like "SAS"
          into member country ISO codes
        - data360_rank_countries: ranks countries within a group by indicator

      UNNECESSARY CLARIFICATION (score low):
        The chatbot's primary response is a disambiguation or clarification
        question when the user's query contained resolvable terms.
        Examples of unnecessary clarification:
        - User says "South Asian countries" -> chatbot asks which
          definition to use, instead of calling find_codelist_value.
        - User says "Sub-Saharan Africa" -> chatbot asks user to confirm
          the region, instead of looking up "SSF".
        - User says "unemployment rate" -> chatbot asks which specific
          indicator, instead of calling data360_search_indicators.
        - User says "latest year" -> chatbot asks which year, instead of
          letting the tool select the latest available year automatically.

        A clarification question is NOT unnecessary if:
        - The user's query is genuinely ambiguous in a way tools cannot
          resolve (e.g., "compare these two economic policies").
        - The chatbot provides the data AND offers clarifying context.

      AUTONOMOUS RESOLUTION (score high):
        The chatbot uses its tools to resolve the scope, delivers a
        complete data response, and does NOT ask the user to provide
        information the tools can retrieve.

      If the assistant output contains no clarification question at all
      (it just delivers data), score 10 (best).

    evaluation_steps:
      - >
        Identify whether the primary content of the assistant response
        is a question addressed to the user, or a data-driven answer.
      - >
        If the response is primarily a question: identify the subject of
        the clarification. Is it something the system's tools could
        resolve autonomously (geographic scope, indicator names, time
        periods, country codes)?
      - >
        Check the tool call list for this turn. Did the chatbot attempt
        to use find_codelist_value, expand_country_group, or
        search_indicators before asking? If yes, the clarification may
        be justified (tools failed). If no tools were called, the
        clarification is unnecessary.
      - >
        Score based on: 10 = data delivered, no clarification needed.
        5 = clarification question asked but data also partially
        provided. 0 = primary response is a clarification question
        on a term that tools can resolve, with no data returned.
    rubric:
      - score_range: [9, 10]
        expected_outcome: >
          The chatbot resolved all ambiguous terms autonomously using
          tools and delivered a complete data response. No clarification
          question was asked.
      - score_range: [4, 8]
        expected_outcome: >
          The chatbot partially resolved the query but asked one
          justified clarification question (e.g., after a tool call
          returned ambiguous results).
      - score_range: [0, 3]
        expected_outcome: >
          The chatbot's primary response was a disambiguation question
          on a resolvable term (geographic group, indicator, year)
          without attempting any tool call to resolve it first. No
          data was returned in this turn.

  - name: "Per-Turn Search Deduplication"
    type: "geval"
    threshold: 0.8
    requires: "tool_calls"
    aggregates_to: "Search Deduplication"
    aggregation: "min"
    criteria: >
      You are evaluating a SINGLE assistant turn for search call
      efficiency. You are given:
        - PRIOR CONTEXT: the serialized tool calls from previous turns,
          including indicator_ids and search queries already resolved.
        - Tool Sequence and Tool Call details for THIS turn (tool names
          and arguments).
        - CURRENT USER INPUT and ASSISTANT OUTPUT.

      The tool `data360_search_indicators` is a DISCOVERY tool.
      It should be called ONCE per topic (or batched via the `queries`
      parameter), not repeatedly with synonymous terms.

      REDUNDANT SEARCH (score low) — any of:
        (1) WITHIN-TURN DUPLICATION: `data360_search_indicators` is
            called 3 or more times in this turn, AND the query terms
            overlap semantically. Examples of overlapping terms:
            - "unemployment rate" + "unemployment" + "total unemployment"
            - "GDP per capita" + "GDP growth" + "economic output per person"
            Two calls with DIFFERENT topics are NOT redundant:
            - "unemployment rate" + "labor force participation" = OK
        (2) CROSS-TURN DUPLICATION: `data360_search_indicators` is
            called with a query that was ALREADY resolved in a prior
            turn. If prior context shows `search_indicators(query=poverty
            headcount)` returned `indicator_id=WB_WDI_SI_POV_DDAY`, and
            this turn calls `search_indicators(query=poverty rate)` for
            the same dimension, that is redundant.
        (3) INDICATOR RE-RESOLUTION: `data360_search_indicators` is
            called when an `indicator_id` was already established in
            prior context and the user's request is a follow-up on the
            same indicator (e.g., "how does that compare to Bangladesh?"
            should NOT trigger a new search for the same indicator).

      EFFICIENT SEARCH (score high) — any of:
        (1) `data360_search_indicators` called once or twice with
            clearly distinct topic queries.
        (2) `data360_search_indicators` called with `queries` parameter
            batching multiple distinct topics in a single call.
        (3) No `data360_search_indicators` called because the
            indicator_id was already known from prior context.

      If `data360_search_indicators` is not called this turn at all,
      score 10 (not applicable).

    evaluation_steps:
      - >
        Count how many times `data360_search_indicators` (or
        `search_indicators`) appears in the Tool Sequence for this turn.
        If 0 or 1 call, score 10 (no duplication possible).
      - >
        If 2+ calls: compare the query terms across all calls.
        Identify any pairs where the queries are semantically equivalent
        or one is a near-synonym of the other (same root concept, same
        indicator domain). Flag those pairs as redundant.
      - >
        If 1+ calls: check PRIOR CONTEXT for any Tool Call that already
        resolved a `search_indicators` query for the same indicator
        domain. Flag any cross-turn redundancy.
      - >
        Score: start at 10. Deduct 3 for each redundant within-turn
        call pair. Deduct 4 for each cross-turn redundant call.
        Floor at 0.
    rubric:
      - score_range: [9, 10]
        expected_outcome: >
          search_indicators called 0-2 times with clearly distinct
          topic queries, OR not called because indicator_id already
          known. No redundancy detected.
      - score_range: [5, 8]
        expected_outcome: >
          search_indicators called 2 times with slightly overlapping
          but distinguishable queries. Minor inefficiency but
          functionally acceptable.
      - score_range: [0, 4]
        expected_outcome: >
          search_indicators called 3+ times with synonymous queries
          (e.g., "unemployment rate" + "unemployment" + "total
          unemployment"), OR called in this turn to re-resolve an
          indicator already established in prior context.
