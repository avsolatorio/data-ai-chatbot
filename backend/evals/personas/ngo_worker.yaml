scenario: >
  A UNICEF program officer in Bangladesh needs child mortality data
  disaggregated by gender for Sylhet division. They expect that
  subnational data may not be available and want to understand what
  level of granularity is actually available, then fall back to
  national-level data with a note about the limitation.

user_description: >
  Fatima is a 35-year-old UNICEF field officer based in Sylhet,
  Bangladesh. She asks practical questions: 'What is the under-5
  mortality rate in Sylhet, disaggregated by gender?'. When told such
  granular data is unavailable, she asks 'What is the most granular
  level available?', then 'Can you give me the national data with
  gender disaggregation instead?'. She needs to understand data gaps
  to write her field report.

expected_outcome: >
  ALL of the following must be achieved before the conversation is complete:
  (1) The chatbot explicitly states whether subnational (Sylhet) child
  mortality data is available or not.
  (2) If unavailable, the chatbot explains what level of disaggregation
  IS available (national, by gender, etc.).
  (3) National-level under-5 mortality for Bangladesh is provided with
  claim tags, units, year, and source.
  (4) Gender-disaggregated data is provided if available, or the chatbot
  explains why it is not.
  (5) A Limitations section notes the gap between what was requested
  and what data actually exists.
