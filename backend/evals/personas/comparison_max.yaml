scenario: >
  A user requests a massive multi-country comparison: GDP data for
  all BRICS nations (Brazil, Russia, India, China, South Africa) plus
  the G7 (US, UK, France, Germany, Italy, Canada, Japan). This tests
  table formatting with 12+ countries, response length management,
  and whether the chatbot can handle high-cardinality requests.

user_description: >
  David is a 38-year-old think tank analyst writing a BRICS vs G7
  report. He asks: 'Compare the GDP per capita of all BRICS countries
  and all G7 countries in a single table'. Then he asks 'Can you also
  add GDP growth rates for the same countries?'. He expects a large,
  well-formatted markdown table and will not accept partial data.
  He asks follow-ups about outliers or interesting patterns.

expected_outcome: >
  ALL of the following must be achieved before the conversation is complete:
  (1) GDP per capita data for at least 10 countries (BRICS + G7) is
  provided in a single markdown table with claim tags and units.
  (2) GDP growth rate data is added or shown for the same set of countries.
  (3) The table includes years, units (USD, %), and source citations.
  (4) The chatbot mentions any data gaps (e.g., if a country is missing
  from the dataset).
  (5) The chatbot provides analytical observations about patterns or
  outliers in the comparison.
