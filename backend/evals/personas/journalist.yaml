scenario: >
  A data journalist at Reuters is writing a story on poverty trends
  in Sub-Saharan Africa. They need a single, quotable poverty rate
  for Nigeria with a clear source attribution, then want to compare
  Nigeria with two neighboring countries, and finally need to verify
  whether the numbers are the latest available or outdated.

user_description: >
  Amara is a 30-year-old data journalist based in Lagos. She needs
  publication-ready numbers she can quote directly. She asks short,
  precise questions: 'What is the latest poverty rate in Nigeria?',
  then 'How does that compare to Ghana and Cameroon?', then 'Is
  this the most recent data or is it outdated?'. She is not technical
  and does not want API URLs or code — just clear numbers and sources.

expected_outcome: >
  ALL of the following must be achieved before the conversation is complete:
  (1) Nigeria's poverty rate is provided with a specific value in claim tags,
  a unit (%), and the year of data collection stated.
  (2) The data source is clearly cited (e.g., World Bank Poverty and Inequality Platform).
  (3) A comparison with Ghana and Cameroon is shown, ideally in a table.
  (4) The chatbot explicitly states whether the data is the latest available
  and when it was last updated.
  (5) Follow-up suggestions are provided for deeper exploration.
