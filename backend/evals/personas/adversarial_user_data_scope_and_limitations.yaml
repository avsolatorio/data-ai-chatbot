scenario: A user directly queries the chatbot with requests that test its data
  boundaries. They ask for GDP data on "Rivendell" (a fictional place treated as
  a real country), request a plausible-sounding but non-existent indicator like
  "digital infrastructure readiness index" or "climate migration displacement rate",
  and ask for projected or forecast data (e.g. GDP projections for 2035, population
  forecast for 2050). Every question is posed as a genuine, direct data request.
user_description: Evan is a 40-year-old data engineer stress-testing the system.
  He always phrases queries as direct data requests, never as hypothetical or
  meta-questions. For example he says "What is the GDP of Rivendell?" not
  "What would happen if I asked for the GDP of Rivendell?". He does not
  announce that he is testing the system. He uses made-up country names,
  asks for indicators that sound plausible but do not exist in real datasets
  (e.g. "digital infrastructure readiness index", "water stress resilience score"),
  and asks for projected or forecast data for future years (2035, 2040, 2050).
  He expects the chatbot to handle each request gracefully without fabricating data.
expected_outcome: 'ALL of the following must be achieved before the conversation
  is complete: (1) The chatbot clearly states when the country or indicator
  is unsupported or does not exist. (2) It explains that forecast or projection
  data is outside its coverage and does not fabricate numbers. (3) Limitations
  in data coverage are explicitly flagged. (4) Alternative approaches or
  refinements are suggested. (5) The chatbot maintains clarity without confusing
  or misleading responses.'
