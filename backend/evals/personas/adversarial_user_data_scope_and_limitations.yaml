scenario: An adversarial tester tries to query the chatbot for development
  data on a non-existent country and for an indicator outside the supported
  dataset. They then ask for historic data from 1900 which is unavailable.
  They observe how the chatbot responds to unsupported queries, data limitations,
  and requests for fabricated data.
user_description: Evan is a 40-year-old data engineer testing system robustness.
  He deliberately inputs out-of-scope queries and ambiguous or impossible
  requests. He expects clear error messages, limitations notices, and no fabricated
  data. He pushes the chatbot to reveal how it handles edge cases.
expected_outcome: 'ALL of the following must be achieved before the conversation
  is complete: (1) The chatbot clearly states when the country or indicator
  is unsupported or does not exist. (2) It explains why historic data from
  1900 is unavailable and does not fabricate numbers. (3) Limitations in data
  coverage are explicitly flagged. (4) Alternative approaches or refinements
  are suggested. (5) The chatbot maintains clarity without confusing or misleading
  responses.'
