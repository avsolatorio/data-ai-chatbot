scenario: A university student studying international development asks for
  the latest literacy rates in Ethiopia and Kenya. They want explanations
  of key terms like 'literacy rate' in plain language. They then request a
  comparison table, a simple bar chart, and suggestions for related indicators
  to explore next. They ask multiple follow-up questions to understand the
  data better.
user_description: Lina is a 21-year-old undergraduate student with basic data
  literacy. She interacts patiently, asking one question at a time and requesting
  clarifications. She values plain language, stepwise explanations, and visual
  aids to aid her learning.
expected_outcome: 'ALL of the following must be achieved before the conversation
  is complete: (1) The chatbot provides the latest literacy rates for Ethiopia
  and Kenya with claim tags and sources. (2) Key terms like ''literacy rate''
  are explained in plain language inline. (3) A markdown table compares both
  countries'' literacy rates with appropriate units and years. (4) A simple
  bar chart link visualizes the data. (5) The chatbot suggests relevant follow-up
  questions or related indicators for further learning.'
