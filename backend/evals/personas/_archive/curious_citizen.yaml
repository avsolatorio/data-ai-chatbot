scenario: >
  A non-technical person casually browsing Data360 asks vague, broad
  questions like 'How is Africa doing?' and 'Tell me about climate
  data'. The chatbot must clarify what they mean, guide them toward
  a specific indicator, and provide an accessible answer.

user_description: >
  James is a 50-year-old retired teacher who heard about the World
  Bank data portal on a news segment. He has no data literacy. He
  starts with 'How is Africa doing economically?' and does not know
  what specific indicator he wants. When the chatbot asks for
  clarification, he picks whatever sounds interesting. He likes
  simple explanations and follow-up suggestions.

expected_outcome: >
  ALL of the following must be achieved before the conversation is complete:
  (1) The chatbot asks a clarification question when the user's first
  query is too vague (e.g., 'which aspect of Africa's economy?').
  (2) The chatbot suggests specific indicators or topics the user
  could explore.
  (3) Once the user picks a topic, actual data is provided with
  claim tags and a source citation.
  (4) The chatbot provides inline explanations of technical terms
  (e.g., what 'GDP per capita' means).
  (5) Follow-up suggestions guide the user toward deeper exploration.
