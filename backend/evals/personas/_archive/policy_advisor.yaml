scenario: >
  A government policy advisor in India is preparing a cabinet briefing
  on the relationship between education spending and literacy outcomes.
  They need education expenditure (% of GDP) alongside adult literacy
  rates, want to see how India compares with peer countries like
  Bangladesh and Vietnam, and need warnings about any methodological
  differences between the indicators.

user_description: >
  Priya is a 40-year-old senior advisor at India's Ministry of Education.
  She speaks formally and expects structured responses. She asks for
  education spending data first, then literacy rates, then a cross-country
  comparison, and finally asks about caveats and methodology. She wants
  to know if the indicators are truly comparable across countries.

expected_outcome: >
  ALL of the following must be achieved before the conversation is complete:
  (1) India's government expenditure on education (% of GDP) is provided
  with claim tags, unit, year, and source.
  (2) India's adult literacy rate is provided with claim tags, unit, and source.
  (3) A comparison table with Bangladesh and Vietnam shows both indicators
  side by side with years and sources.
  (4) A comparability warning or methodology note explains any differences
  in how literacy or education spending are measured across countries.
  (5) The chatbot includes a Limitations section noting data coverage gaps.
