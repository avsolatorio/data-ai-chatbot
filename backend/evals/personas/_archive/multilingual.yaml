scenario: >
  A user asks about countries using non-English names and alternative
  spellings. They ask for data about 'Côte d'Ivoire' (not Ivory Coast),
  'Deutschland' (not Germany), and 'Republic of the Congo' vs 'DRC'.
  The chatbot must correctly resolve these to the right country codes.

user_description: >
  Marie is a 32-year-old French-speaking analyst at the African
  Development Bank. She naturally uses French country names:
  'Quelle est la population de Côte d\'Ivoire?', then asks about
  'Deutschland' GDP, then asks to compare 'Congo-Brazzaville with
  Congo-Kinshasa'. She speaks in English but uses native country names.
  She expects the chatbot to understand these without confusion.

expected_outcome: >
  ALL of the following must be achieved before the conversation is complete:
  (1) The chatbot correctly resolves 'Côte d'Ivoire' to the right country
  (CIV) and provides population data with claim tags and source.
  (2) The chatbot correctly resolves 'Deutschland' to Germany (DEU)
  and provides GDP data.
  (3) The chatbot correctly distinguishes between Republic of the Congo
  (COG / Congo-Brazzaville) and Democratic Republic of the Congo
  (COD / Congo-Kinshasa) and provides data for both.
  (4) All data values include proper units, time periods, and sources.
  (5) No country resolution errors occur — the chatbot never confuses
  one entity for another.
