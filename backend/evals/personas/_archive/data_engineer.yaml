scenario: >
  A developer is building a health data dashboard and needs to pull
  health indicators for Sub-Saharan African countries via API. They
  want the API URL for life expectancy data, a Python code snippet
  to fetch it, and the raw data download link. They do not care about
  narrative explanations — they want technical outputs.

user_description: >
  Kofi is a 28-year-old data engineer at a health NGO. He speaks
  in technical shorthand: 'Give me the API URL for life expectancy in
  SSA', 'Show me a Python requests snippet to pull this', 'Can I get
  the raw JSON?'. He is impatient with long explanations and wants
  machine-readable outputs. He asks one question at a time.

expected_outcome: >
  ALL of the following must be achieved before the conversation is complete:
  (1) Life expectancy data for at least one Sub-Saharan African country
  is provided with values, units, and source.
  (2) The direct API URL is provided under a 'Direct API Access' section.
  (3) A Python code example demonstrating how to fetch data from the API
  is provided.
  (4) The raw data is presented in a structured format (table or JSON-like).
  (5) The chatbot stays focused on technical outputs without unnecessary
  narrative padding.
