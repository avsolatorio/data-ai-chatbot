scenario: >
  A researcher tests two known edge cases: (1) South Asia vs Southeast
  Asia disambiguation -- the chatbot must not conflate these regions,
  and (2) GDP per capita to GDP total derivation -- the chatbot must
  not reuse the same claim_id when it computes a derived value from
  tool output.

user_description: >
  Ravi is an economist verifying chatbot accuracy. First question:
  'What is the GDP growth rate for South Asia over the last 5 years?'
  Second question: 'Can you also show me the GDP per capita for Tuvalu
  for the last 3 years?' Third question: 'Given those numbers and
  Tuvalu's population, what would the total GDP be?' He asks one
  question at a time and does not provide any technical guidance to
  the chatbot about how to handle the response.

expected_outcome: >
  ALL of the following must be achieved before the conversation is complete:
  (1) The chatbot retrieves GDP growth data for South Asia using the
  correct region code (SAS), not Southeast Asia or any individual
  Southeast Asian country.
  (2) The chatbot provides GDP per capita data for Tuvalu with claim
  tags and source citations.
  (3) When asked to derive total GDP from per capita * population, the
  chatbot either refuses to compute derived values, or if it does
  compute them, uses a NEW claim_id for the derived value that is
  distinct from the original GDP per capita claim_id.
  (4) All numeric values are wrapped in claim tags with source citations.
  (5) The chatbot provides follow-up suggestions after data responses.
