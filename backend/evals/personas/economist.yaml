scenario: >
  A World Bank economist is building a Phillips curve model and needs
  inflation rate and unemployment rate data for Brazil. They want to
  compare the two indicators side by side in a table, check for data
  quality and comparability issues between the two series, get the
  exact API URLs for programmatic access, and receive methodology
  notes about the measurement approaches.

user_description: >
  Sarah is a 35-year-old macroeconomist at the World Bank's Research
  department. She is highly technical and expects precise, well-sourced
  data. She asks for inflation data first, then unemployment data, then
  wants to compare both in a table, and asks about any limitations or
  comparability issues. She insists on exact units, time periods, and
  API URLs for reproducibility.

expected_outcome: >
  ALL of the following must be achieved before the conversation is complete:
  (1) Brazil's inflation rate data is provided with specific values in
  claim tags, units (%), and the data source cited.
  (2) Brazil's unemployment rate data is provided with values, units,
  and the source.
  (3) Both indicators are compared side-by-side in a markdown table with
  years, units, and a note about latest available data.
  (4) API URLs for both indicators are provided under 'Direct API Access'.
  (5) A comparability warning or methodology note is included about
  differences between the two series (e.g., ILO modeled vs national,
  different base years or measurement methods).
