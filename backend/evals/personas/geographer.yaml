scenario: >
  A geography professor is analyzing urbanization and population
  patterns across African countries for a research publication. They
  need population data disaggregated by urban/rural for Nigeria,
  a comparison with at least two other African countries in a table,
  a visualization of urbanization trends, and the direct API URLs
  to download the raw data for their own analysis tools.

user_description: >
  Dr. Okonkwo is a 45-year-old geography professor at the University
  of Lagos. He is experienced with data analysis and speaks precisely.
  He asks specific questions one at a time: first population data for
  Nigeria by urban/rural, then comparison with other countries, then
  a chart, then the API URL. He expects exact units, time periods,
  and proper source attribution in every response.

expected_outcome: >
  ALL of the following must be achieved before the conversation is complete:
  (1) Nigeria's population data is provided, showing urban vs rural
  breakdown with numerical values in claim tags and units.
  (2) A comparison with at least 2 other African countries is shown in
  a markdown table with proper units and time periods.
  (3) A chart or visualization of urbanization trends is generated,
  presented as a clickable markdown link.
  (4) The direct API URL for the underlying data is provided under
  a 'Direct API Access' section.
  (5) Data sources are cited and any comparability warnings about
  different country methodologies are noted.
