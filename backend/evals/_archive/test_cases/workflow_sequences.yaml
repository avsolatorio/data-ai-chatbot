# Workflow Sequence evaluation test cases
# Validates multi-step tool call ordering.

- id: "wf_standard_data_flow_01"
  description: "Standard data retrieval flow: resolve → search → fetch"
  input: "What is the GDP growth rate of Nigeria?"
  expected_tools:
    - tool: "data360_find_codelist_value"
    - tool: "data360_search_indicators"
    - tool: "data360_get_data"
  tags: ["workflow", "standard-flow"]

- id: "wf_viz_flow_02"
  description: "Full visualization flow: resolve → search → fetch → chart"
  input: "Show me a bar chart of poverty rates in Sub-Saharan Africa"
  expected_tools:
    - tool: "data360_find_codelist_value"
    - tool: "data360_search_indicators"
    - tool: "data360_get_data"
    - tool: "data360_get_viz_spec"
  expect_chart: true
  tags: ["workflow", "visualization-flow"]

- id: "wf_metadata_before_data_03"
  description: "Methodology-first flow: search → metadata → optionally data"
  input: "How is the Gini index calculated and what is it for Mexico?"
  expected_tools:
    - tool: "data360_search_indicators"
    - tool: "data360_get_metadata"
    - tool: "data360_get_data"
  tags: ["workflow", "metadata-flow"]

- id: "wf_disagg_check_04"
  description: "Check disaggregation before fetching data"
  input: "What years of education data are available for Rwanda?"
  expected_tools:
    - tool: "data360_find_codelist_value"
    - tool: "data360_search_indicators"
    - tool: "data360_get_disaggregation"
  unexpected_tools: ["data360_get_data"]
  tags: ["workflow", "disaggregation-check"]
