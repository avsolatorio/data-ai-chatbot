# Routing evaluation test cases
# Tests the intent router (RESEARCH vs DIRECT classification).

# ── DIRECT cases ──────────────────────────────────────────────
- id: "rt_greeting_01"
  description: "Simple greeting"
  input: "Hello!"
  expected_routing: "DIRECT"
  tags: ["routing", "direct"]

- id: "rt_thanks_02"
  description: "Thank you message"
  input: "Thanks for the help!"
  expected_routing: "DIRECT"
  tags: ["routing", "direct"]

- id: "rt_small_talk_03"
  description: "Small talk / off-topic"
  input: "What's the weather like today?"
  expected_routing: "DIRECT"
  tags: ["routing", "direct", "off-topic"]

- id: "rt_sports_04"
  description: "Sports question (off-topic)"
  input: "Who won the World Cup last year?"
  expected_routing: "DIRECT"
  tags: ["routing", "direct", "off-topic"]

- id: "rt_recipe_05"
  description: "Recipe question (off-topic)"
  input: "How do I make banana bread?"
  expected_routing: "DIRECT"
  tags: ["routing", "direct", "off-topic"]

