# ── EDGE cases ────────────────────────────────────────────────
- id: "rt_ambiguous_13"
  description: "Ambiguous — could be general or data-related"
  input: "Tell me about poverty"
  expected_routing: "RESEARCH"
  tags: ["routing", "research", "ambiguous"]

- id: "rt_followup_14"
  description: "Follow-up on previous data"
  input: "What about for the year 2020?"
  expected_routing: "RESEARCH"
  conversation_history:
    - role: "user"
      content: "What is the GDP of Kenya?"
    - role: "assistant"
      content: "The GDP of Kenya in 2023 was approximately $113 billion USD."
  tags: ["routing", "research", "follow-up"]
