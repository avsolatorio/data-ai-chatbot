[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for AI Chatbot application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[all]>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.2,<5.0.0",
    "pydantic[email]>=2.5.3",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.8.2",
    "greenlet>=3.2.4",
    "openai>2.8.1",
    "litellm>=1.50.0",
    "azure-identity>=1.15.0",
    "json5>=0.12.1",
    "fastmcp>=2.13.3",
    "redis>=5.0.0",
    "hiredis>=2.2.0",
    "pyodbc>=5.3.0",
    "aioodbc>=0.5.0",
    "azure-identity>=1.25.1",
    "gunicorn>=25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "black>=24.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "ruff>=0.14.7",
]
