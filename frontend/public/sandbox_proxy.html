<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sandbox Proxy</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <script>
    // Sandbox proxy for MCP Apps (see https://mcpui.dev/guide/client/walkthrough)
    // Loads app HTML via blob URL instead of document.write so app content
    // cannot break this script (e.g. unexpected identifier errors).

    function sendReady() {
      try {
        window.parent.postMessage({
          method: 'ui/notifications/sandbox-proxy-ready',
          params: {}
        }, '*');
      } catch (e) {
        // ignore
      }
    }

    window.addEventListener('message', function (event) {
      const data = event.data;
      if (!data || typeof data !== 'object') return;

      if (data.method === 'ui/notifications/sandbox-resource-ready') {
        const params = data.params || {};
        const html = params.html;
        if (html && typeof html === 'string') {
          try {
            const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            window.location.replace(url);
          } catch (e) {
            window.parent.postMessage({
              method: 'ui/notifications/sandbox-error',
              params: { message: (e && e.message) || String(e) }
            }, '*');
          }
        }
      }
    });

    // Send ready immediately and on load so the parent can proceed as soon as it's listening.
    sendReady();
    if (typeof queueMicrotask === 'function') {
      queueMicrotask(sendReady);
    } else {
      setTimeout(sendReady, 0);
    }
    if (document.readyState === 'complete') {
      sendReady();
    } else {
      window.addEventListener('load', sendReady);
    }
    // Repeat ready every 200ms for 15s so parent always receives it (handles React Strict Mode double-mount and late listener).
    var readyCount = 0;
    var readyInterval = setInterval(function () {
      sendReady();
      readyCount += 1;
      if (readyCount >= 75) clearInterval(readyInterval);
    }, 200);
  </script>
</body>
</html>
