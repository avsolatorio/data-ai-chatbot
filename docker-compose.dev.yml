services:
  frontend:
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - NODE_ENV=development
      - NEXT_DISABLE_FONT_OPTIMIZATION=1
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      # Mount local data360-mcp packages so copy:data360 can build from source inside the container
      - ../data360-mcp/packages:/data360-mcp/packages
      # - frontend_next:/app/.next
    command: ["sh", "-c", "node scripts/copy-data360.js && pnpm dev --port 3001"]



# =============================================================================
# Volumes
# =============================================================================
volumes:
  frontend_node_modules:
  # frontend_next:
